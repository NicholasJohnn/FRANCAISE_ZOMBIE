<style>
/* Layout: one full-screen card per video, snapping vertically; fixed header with topic chips on top. */
:root{
  --ink:#0d1322;        /* page ground, deep ink blue */
  --ink-2:#161e33;      /* raised surfaces */
  --line:#2a3550;
  --paper:#f3efe6;      /* main text */
  --muted:#a3abc0;
  --accent:#ffcf4a;     /* chalk yellow: chips, focus, saved */
  --bleu:#5b8cff;
  --rouge:#ff6b5e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

header{position:fixed;inset:0 0 auto;z-index:20;padding-top:var(--top);
  background:linear-gradient(var(--ink) 55%, rgba(13,19,34,0));}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:baseline;gap:6px}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--ink-2);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip .n{opacity:.6;font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}

#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--top) + 104px) max(16px,env(safe-area-inset-right,0px)) calc(var(--bot) + 18px) max(16px,env(safe-area-inset-left,0px));gap:14px;overflow:hidden}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.2);opacity:.28;z-index:-1}

.media{position:relative;width:100%;max-width:720px;margin:0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.45);flex:none}
.slide.short .media{aspect-ratio:9/16;width:auto;height:min(50vh,100%);max-height:calc(100% - 170px);max-width:100%}
.slide.short .info{grid-template-columns:1fr;gap:8px}
.slide.short .actions{flex-direction:row;justify-content:flex-start;gap:18px;order:-1}
.slide.short .act{flex-direction:row;gap:6px}
.slide.short .act .c{width:36px;height:36px}
.slide.short.showvocab .media{height:min(36vh,100%)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 60%, rgba(0,0,0,.5))}
.play span{width:68px;height:68px;border-radius:50%;background:rgba(13,19,34,.72);border:2px solid var(--paper);display:grid;place-items:center;backdrop-filter:blur(4px)}
.play svg{width:26px;height:26px;margin-left:4px}
.dur{position:absolute;left:10px;top:10px;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(13,19,34,.8);letter-spacing:.04em;text-transform:uppercase}

.info{width:100%;max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;min-height:0}
.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.ch{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ch b{color:var(--paper);font-weight:700}
.title{font-family:var(--display);font-weight:700;font-size:clamp(18px,4.8vw,24px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag.lvl{color:var(--ink);background:var(--paper);border-color:var(--paper);font-weight:700}
.tag.ep{color:var(--bleu);border-color:color-mix(in srgb,var(--bleu) 45%,transparent)}
.vocab{margin:2px 0 0;padding:10px 12px;border-radius:10px;background:rgba(22,30,51,.82);border:1px solid var(--line);font-size:14px;line-height:1.45;display:grid;gap:3px}
.vocab .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.vocab i{font-style:normal;color:var(--muted)}
.slide.short .vocab{display:none}
.slide.short.showvocab .vocab{display:grid}

.actions{display:flex;flex-direction:column;gap:12px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none}
.act .c{width:44px;height:44px;border-radius:50%;background:rgba(22,30,51,.85);border:1px solid var(--line);display:grid;place-items:center;color:var(--paper)}
.act svg{width:20px;height:20px}
.act[aria-pressed="true"] .c{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.act.vbtn{display:none}
.slide.short .act.vbtn{display:flex}

/* Tip card */
.slide.tip{justify-content:center}
.tipcard{max-width:560px;margin:0 auto;padding:26px 22px;border-radius:18px;background:var(--paper);color:var(--ink);display:grid;gap:12px;transform:rotate(-1.2deg);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.tipcard .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#8a5a00}
.tipcard h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,34px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tipcard p{margin:0;font-size:16px;line-height:1.5}
.tipcard .sw{font-size:13px;color:#4a5068}

.empty{height:100%;display:grid;place-items:center;text-align:center;padding:0 24px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--paper);margin:0 0 8px}

.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 24px);transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;transition:opacity .2s}
.progress{position:fixed;right:max(6px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);writing-mode:vertical-rl;z-index:15;font-variant-numeric:tabular-nums;letter-spacing:.06em}
@media (min-width:900px){ .progress{right:24px} }
@media (prefers-reduced-motion:reduce){ #feed{scroll-behavior:auto} .tipcard{transform:none} }
</style>
</head>

// Cartes conseils TEF, glissées dans le fil
const TIPS = [
 ["Compréhension orale","Écoute d'abord la question.","Au TEF, lis la question et les choix avant l'extrait audio. Tu sauras quoi chercher : un chiffre, une opinion, un lieu.","Entraîne-toi ici : avant chaque vidéo, devine le sujet à partir du titre."],
 ["Expression orale","Section A : tu poses les questions.","On te donne une annonce et tu appelles pour obtenir des informations. Prépare des questions variées : est-ce que, combien, à quelle heure, est-il possible de…","Regarde la vidéo sur les appels téléphoniques dans « Expressions »."],
 ["Expression orale","Section B : tu dois convaincre.","Tu présentes un document à un ami et tu le persuades. Structure : d'abord, ensuite, de plus, enfin. Réponds aux objections sans te répéter.","Les sujets d'actualité sont parfaits pour t'entraîner à argumenter."],
 ["Expression écrite","Les connecteurs font la note.","Cependant, néanmoins, en revanche, par conséquent, c'est pourquoi. Varie-les dans chaque texte au lieu de répéter « mais » et « donc ».","Note trois connecteurs entendus dans la prochaine vidéo."],
 ["Lexique","Le registre compte.","Le TEF teste le registre : soutenu, courant, familier. « Bosser », « travailler » et « œuvrer » ne s'utilisent pas au même endroit.","Les dessins animés sont courants ; France Culture est soutenu."],
 ["Méthode","Regarde deux fois.","Première écoute sans sous-titres pour le sens général. Deuxième écoute avec les sous-titres français pour les détails et l'orthographe.","Active les sous-titres avec le bouton CC dans le lecteur."],
 ["Compréhension écrite","Repère les mots de la question.","Cherche dans le texte les synonymes des mots de la question, pas les mêmes mots. Les bonnes réponses sont souvent reformulées.","Le vocabulaire sous chaque vidéo t'aide à construire ces synonymes."]
];

// --- état ---
const store = {
  get(k,d){ try{ const v=localStorage.getItem("filtef:"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("filtef:"+k,JSON.stringify(v)); }catch(e){} }
};
let saved = new Set(store.get("saved",[]));
let seen  = new Set(store.get("seen",[]));
let cat   = store.get("cat","all");
let shuffled = store.get("shuffle",false);
let autoplay = store.get("auto",false);
let userTapped = false;

const feed = document.getElementById("feed");
const chipsEl = document.getElementById("chips");
const $ = (s,r=document)=>r.querySelector(s);

const icons = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 4.4 2.4h1.6c.8-1.2 2.3-2.4 4.4-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};

function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function buildChips(){
  const counts = {all:V.length, saved:V.filter(v=>saved.has(v[0])).length};
  V.forEach(v=>counts[v[1]]=(counts[v[1]]||0)+1);
  const list = [["all","Tout"],...Object.entries(CATS),["saved","Enregistrés"]];
  chipsEl.innerHTML = list.map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${k===cat}">${l}<span class="n">${counts[k]||0}</span></button>`).join("");
}

function seededShuffle(arr){
  const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}

function render(){
  let items = V.filter(v => cat==="all" ? true : cat==="saved" ? saved.has(v[0]) : v[1]===cat);
  if(shuffled) items = seededShuffle(items);
  else if(cat==="all"){ // alterne les thèmes pour un fil varié
    const by={}; items.forEach(v=>(by[v[1]]=by[v[1]]||[]).push(v));
    const keys=Object.keys(by), mixed=[]; let left=true;
    while(left){ left=false; for(const k of keys){ if(by[k].length){ mixed.push(by[k].shift()); left=true; } } }
    items=mixed;
  }
  document.getElementById("count").textContent = `${seen.size} vues sur ${V.length}`;
  if(!items.length){
    feed.innerHTML = `<div class="empty"><div><h2>Rien d'enregistré pour l'instant</h2><p>Touche le cœur sur une vidéo pour la retrouver ici et la revoir avant l'examen.</p></div></div>`;
    updateProgress(); return;
  }
  let html="", t=0;
  items.forEach((v,i)=>{
    html += slideHTML(v);
    if((cat==="all") && (i+1)%6===0) html += tipHTML(TIPS[t++ % TIPS.length]);
  });
  feed.innerHTML = html;
  feed.scrollTop = 0;
  observe();
}

function slideHTML([id,c,short,lvl,ep,ch,title,vocab]){
  const thumb=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  const words = vocab.split(";").map(p=>{ const [a,b]=p.split("="); return `<div>${esc(a)} <i>– ${esc(b)}</i></div>`; }).join("");
  return `<section class="slide${short?" short":""}" data-id="${id}" data-short="${short}">
    <div class="bg" style="background-image:url('${thumb}')"></div>
    <div class="media">
      <img src="${thumb}" alt="" loading="lazy">
      <button class="play" aria-label="Lire : ${esc(title)}"><span>${icons.play}</span></button>
      ${short?'<span class="dur">Short</span>':''}
    </div>
    <div class="info">
      <div class="meta">
        <div class="ch"><b>${esc(ch)}</b>${seen.has(id)?`<span>· vue</span>`:""}</div>
        <h2 class="title">${esc(title)}</h2>
        <div class="tags"><span class="tag lvl">${lvl}</span><span class="tag ep">${EP[ep]}</span><span class="tag">${CATS[c]}</span></div>
        <div class="vocab"><span class="h">Mots à retenir</span>${words}</div>
      </div>
      <div class="actions">
        <button class="act save" aria-pressed="${saved.has(id)}" aria-label="Enregistrer"><span class="c">${icons.heart}</span>${saved.has(id)?"Gardée":"Garder"}</button>
        <button class="act vbtn" aria-label="Afficher le vocabulaire"><span class="c">${icons.book}</span>Mots</button>
        <a class="act" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="c">${icons.yt}</span>YouTube</a>
      </div>
    </div>
  </section>`;
}

function tipHTML([k,h,p,sw]){
  return `<section class="slide tip"><div class="tipcard"><span class="k">Conseil TEF · ${esc(k)}</span><h2>${esc(h)}</h2><p>${esc(p)}</p><p class="sw">${esc(sw)}</p></div></section>`;
}

function play(slide){
  const media=$(".media",slide); if($("iframe",media)) return;
  const id=slide.dataset.id;
  const f=document.createElement("iframe");
  f.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1&cc_lang_pref=fr&hl=fr`;
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen=true;
  f.referrerPolicy="strict-origin-when-cross-origin";
  f.title=$(".title",slide).textContent;
  media.appendChild(f);
  if(!seen.has(id)){ seen.add(id); store.set("seen",[...seen]); document.getElementById("count").textContent=`${seen.size} vues sur ${V.length}`; }
}
function stop(slide){ const f=$(".media iframe",slide); if(f) f.remove(); }

let io;
function observe(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      const s=e.target;
      if(e.intersectionRatio>=0.7){
        current=s; updateProgress();
        if(autoplay && userTapped && s.dataset.id) play(s);
      } else if(e.intersectionRatio<0.3){ stop(s); }
    });
  },{root:feed,threshold:[0,0.3,0.7,1]});
  feed.querySelectorAll(".slide").forEach(s=>io.observe(s));
}
let current=null;
function updateProgress(){
  const all=[...feed.querySelectorAll(".slide")];
  const i=all.indexOf(current);
  document.getElementById("progress").textContent = all.length ? `${Math.max(i,0)+1} / ${all.length}` : "";
}

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1600);
}

// --- événements ---
feed.addEventListener("click",e=>{
  const slide=e.target.closest(".slide"); if(!slide) return;
  if(e.target.closest(".play")){ userTapped=true; play(slide); return; }
  const sv=e.target.closest(".save");
  if(sv){
    const id=slide.dataset.id;
    if(saved.has(id)){ saved.delete(id); toast("Retirée des enregistrés"); } else { saved.add(id); toast("Enregistrée"); }
    store.set("saved",[...saved]);
    sv.setAttribute("aria-pressed",saved.has(id));
    sv.lastChild.textContent = saved.has(id)?"Gardée":"Garder";
    buildChips(); return;
  }
  if(e.target.closest(".vbtn")) slide.classList.toggle("showvocab");
});
chipsEl.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  cat=b.dataset.cat; store.set("cat",cat);
  chipsEl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  render();
});
const shBtn=document.getElementById("shuffle"), auBtn=document.getElementById("auto");
shBtn.setAttribute("aria-pressed",shuffled); auBtn.setAttribute("aria-pressed",autoplay);
shBtn.onclick=()=>{ shuffled=!shuffled; store.set("shuffle",shuffled); shBtn.setAttribute("aria-pressed",shuffled); toast(shuffled?"Ordre aléatoire":"Ordre par thème"); render(); };
auBtn.onclick=()=>{ autoplay=!autoplay; store.set("auto",autoplay); auBtn.setAttribute("aria-pressed",autoplay); userTapped=true;
  toast(autoplay?"Lecture auto activée":"Lecture auto désactivée"); if(autoplay&&current&&current.dataset.id) play(current); };
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="j"){ feed.scrollBy({top:feed.clientHeight}); e.preventDefault(); }
  if(e.key==="ArrowUp"||e.key==="k"){ feed.scrollBy({top:-feed.clientHeight}); e.preventDefault(); }
});

if(!CATS[cat] && cat!=="all" && cat!=="saved") cat="all";
buildChips(); render();
</script>
</body>
</html>
